name: DeskPhone
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
options:
  bundleIdPrefix: ai.gentility
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  DeskPhoneKit:
    type: framework
    platform: iOS
    sources: [Kit]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.gentility.desk.phone.kit
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postCompileScripts:
      - name: Stamp the phone build
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          revision=$(git -C "$SRCROOT" rev-parse --short=12 HEAD)
          changes=$(git -C "$SRCROOT" status --porcelain -- Kit project.yml)
          dirty=""
          if [ -n "$changes" ]; then dirty="-modified"; fi
          stamp="ios-${revision}${dirty}-$(date -u +%Y%m%dT%H%M%SZ)"
          mkdir -p "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          printf '%s\n' "$stamp" > "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/PhoneBuild.txt"
  KitTestHost:
    type: application
    platform: iOS
    sources:
      - path: TestHost
        excludes: ["Info.plist"]
    dependencies:
      - target: DeskPhoneKit
    info:
      path: TestHost/Info.plist
      properties:
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.gentility.desk.phone.testhost
  DeskPhoneKitTests:
    type: bundle.unit-test
    platform: iOS
    sources: [KitTests]
    dependencies:
      - target: DeskPhoneKit
      - target: KitTestHost
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/KitTestHost.app/KitTestHost"
        BUNDLE_LOADER: "$(TEST_HOST)"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postCompileScripts:
      - name: Copy the recorded protocol
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          from="${SRCROOT}/../../contract"
          into="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/protocol"
          rm -rf "$into"
          mkdir -p "$into"
          cp -R "$from/server" "$into/server"
          cp "$from/released.json" "$into/released.json"
          if [ -d "$from/door" ]; then cp -R "$from/door" "$into/door"; fi
  DeskPhone:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["Info.plist", "PhoneInfo.plist"]
    dependencies:
      - target: DeskPhoneKit
      - framework: ../build/Phonenode.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.gentility.desk.phone
        INFOPLIST_FILE: App/PhoneInfo.plist
        INFOPLIST_PREPROCESS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: App/DeskPhone.entitlements
      configs:
        Debug:
          INFOPLIST_PREPROCESSOR_DEFINITIONS: DEBUG=1
  DeskPhoneUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: DeskPhone
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ai.gentility.desk.phone.uitests
        TEST_TARGET_NAME: DeskPhone
schemes:
  DeskPhoneKit:
    build:
      targets:
        DeskPhoneKit: all
        KitTestHost: [test]
        DeskPhoneKitTests: [test]
    test:
      targets: [DeskPhoneKitTests]
  DeskPhone:
    build:
      targets:
        DeskPhone: all
    run:
      config: Debug
  DeskPhoneUITests:
    build:
      targets:
        DeskPhone: all
        DeskPhoneUITests: [test]
    test:
      config: Debug
      targets: [DeskPhoneUITests]
