# The phone app's contract readers, on Linux: whenever the phone or the
# contract it reads changes. The Phonenode framework, the app and its
# KitTests run on macOS in phone-kit.yml, and only when the phone itself
# changes: a contract-only change, as every contract publish is, runs these
# readers and starts no macOS runner (ruled 2026-11-18).
name: phone

on:
  pull_request:
    paths:
      - "phone/**"
      - "connector/phonenode/**"
      - "connector/internal/**"
      - "connector/go.mod"
      - "connector/go.sum"
      - "contract/**"
      - "bin/phone-*"
      - ".github/workflows/phone.yml"
  push:
    branches: [main]
    paths:
      - "phone/**"
      - "connector/phonenode/**"
      - "connector/internal/**"
      - "connector/go.mod"
      - "connector/go.sum"
      - "contract/**"
      - "bin/phone-*"
      - ".github/workflows/phone.yml"

permissions:
  contents: read

jobs:
  readers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swiftc --version
      - run: python3 -I bin/phone-unknown-words
      - run: bin/phone-readers
